name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  cli:
    name: CLI — shellcheck + bash tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: ShellCheck (error severity)
        run: shellcheck -S error bin/ccx install.sh tests/*.sh
      - name: Bash test suite
        run: bash tests/test_ccx.sh

  rust:
    name: Rust — fmt + clippy + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Format check
        run: |
          cargo fmt --manifest-path router/Cargo.toml --check
          cargo fmt --manifest-path gui/Cargo.toml --all --check
      - name: Clippy (deny warnings)
        run: |
          cargo clippy --manifest-path router/Cargo.toml --all-targets -- -D warnings
          cargo clippy --manifest-path gui/core/Cargo.toml --all-targets -- -D warnings
      - name: Test
        run: |
          cargo test --manifest-path router/Cargo.toml
          cargo test --manifest-path gui/core/Cargo.toml

  web:
    name: Web — site + GUI frontend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build docs site
        working-directory: site
        run: npm ci && npm run build
      - name: Build GUI frontend
        working-directory: gui
        run: npm ci && npm run build
